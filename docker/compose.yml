# meshcom-status with its PostgreSQL database.
#
# Run from this folder (docker/):
#
#   cp env.example .env               then set MESHCOM_STATUS_NODE_HOST to your node
#   docker compose up -d              start (pulls sardylan/meshcom-status; --build builds it here)
#   docker compose logs -f server     follow the server's log
#   docker compose down               stop (the database stays in docker/volumes/postgres/data)
#
# Everything is in this file, with defaults; `.env` (optional, never committed, see env.example)
# changes what differs for an installation. The page is on http://localhost:8080/. The database
# is reachable only from the server, on the Compose network.

name: meshcom-status

services:
  postgres:
    image: postgres:17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meshcom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meshcom}
      POSTGRES_DB: ${POSTGRES_DB:-meshcom}
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  server:
    image: sardylan/meshcom-status:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MESHCOM_STATUS_NODE_HOST: ${MESHCOM_STATUS_NODE_HOST:-192.0.2.10}
      MESHCOM_STATUS_DATABASE_URL: postgres://${POSTGRES_USER:-meshcom}:${POSTGRES_PASSWORD:-meshcom}@postgres:5432/${POSTGRES_DB:-meshcom}
      MESHCOM_STATUS_WEB_LISTEN_ADDRESS: 0.0.0.0:8080
      MESHCOM_STATUS_CONFIG: /etc/meshcom-status/meshcom-status.toml
      MESHCOM_STATUS_LOG_LEVEL: ${MESHCOM_STATUS_LOG_LEVEL:-info}
    ports:
      - "${MESHCOM_STATUS_HTTP_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
