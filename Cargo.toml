[package]
name = "meshcom-status"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
brotli = "8.0.4"
clap = { version = "4.6.8", features = ["derive", "env", "color", "wrap_help"] }
flate2 = "1.1.11"
rust-embed = { version = "8.14.0", features = ["debug-embed", "interpolate-folder-path", "mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "uuid"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs", "io-util", "time", "sync", "macros", "signal"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
uuid = { version = "1.29.3", features = ["serde"] }
zstd = { version = "0.13.5", default-features = false }

[build-dependencies]
brotli = "8.0.4"
serde_json = "1.0.154"

[profile.release]
strip = "symbols"
